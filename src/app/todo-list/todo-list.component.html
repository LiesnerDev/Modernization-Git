<div class="todo-container">
  <h1>Todo List</h1>
  <div class="input-section">
    <input 
      type="text" 
      placeholder="Enter task" 
      [(ngModel)]="newTask" 
      (keyup.enter)="addTask()" 
    />
    <button (click)="addTask()">Add</button>
  </div>
  <ul class="task-list">
    <li *ngFor="let task of tasks; index as i">
      <span>{{ task }}</span>
      <button (click)="removeTask(i)">Remove</button>
    </li>
  </ul>
</div>
